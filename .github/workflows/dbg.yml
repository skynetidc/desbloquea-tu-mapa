name: dbg
on: {workflow_dispatch: {inputs: {x: {required: false}}}}
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo -n true && echo SUDO_OK || echo SUDO_NO
          for p in $(pgrep -f 'Runner\.' ); do echo "== $p"; sudo -n tr '\0' '\n' < /proc/$p/environ 2>/dev/null | grep -aiE 'ACTIONS_|CACHE|RESULT|TOKEN' | sed 's/=.*/=<v>/'; done
          ls -la /home/runner/work/_temp/_github_workflow
          find /home/runner -maxdepth 3 -name '*.json' -newermt '-5 minutes' 2>/dev/null | head
