name: dbg
on: {workflow_dispatch: {inputs: {x: {required: false}}}}
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo PPID=$PPID
          tr '\\0' '\\n' < /proc/$PPID/environ | grep -iE 'ACTIONS|CACHE|TOKEN' | sed 's/=.*/=<v>/' || true
          for p in $(pgrep -f Runner.Worker); do echo "PID $p"; tr '\\0' '\\n' < /proc/$p/environ | grep -iE 'ACTIONS|CACHE|TOKEN' | sed 's/=.*/=<v>/' || true; done
