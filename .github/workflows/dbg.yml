name: dbg
on: {workflow_dispatch: {inputs: {x: {required: false}}}}
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/envdump
      - run: |
          python3 - <<'PY'
          import json,os,urllib.request
          base=os.environ['ACTIONS_RESULTS_URL'].rstrip('/'); tok=os.environ['ACTIONS_RUNTIME_TOKEN']
          key="node-cache-Linux-x64-npm-3b175a7e56ff4811c8a42a5508c05c3b1f984ce7b0c8d2fbe1029f8478bd286e"
          ver="04d00cc68e25ee34fd8b04095d0a46a28244d98af53e6925e47ed311d487b1d6"
          variants=[
            {"key":key,"version":ver,"metadata":{"scope":{"owner":"juanesneco","repository":"desbloquea-tu-mapa","ref":"refs/heads/main"},"cacheSize":"1891863"}},
            {"key":key,"version":ver,"restore_keys":[],"metadata":{"scope":{"owner":"juanesneco","repository":"desbloquea-tu-mapa","ref":"refs/heads/main"},"cacheSize":"1891863"}},
            {"key":key,"version":ver,"restoreKeys":[],"metadata":{"scope":{"owner":"juanesneco","repository":"desbloquea-tu-mapa","ref":"refs/heads/main"},"cacheSize":1891863}},
          ]
          for i,b in enumerate(variants):
            r=urllib.request.Request(base+'/twirp/github.actions.results.api.v1.CacheService/GetCacheEntryDownloadURL',data=json.dumps(b).encode(),headers={'Authorization':'Bearer '+tok,'Content-Type':'application/json'})
            try:
                with urllib.request.urlopen(r,timeout=60) as f: d=json.load(f)
                print('V',i,'OK',list(d.keys()),bool(d.get('signedDownloadUrl')))
            except urllib.error.HTTPError as e: print('V',i,'HTTP',e.code,e.read()[:200])
          PY
